interface:
  display_name: "生成通用 V1 活动页"
  short_description: "三套最终背景配轻量前景样张，选中后只精细制作一套完整素材"
  default_prompt: "使用 $v1-activity-page，按专业来源顺序用可用网页搜索与图片查看取得参考，需要时使用内置浏览器，路径失败自动切换；全轮共用2～3项主要参考，按缺少的背景、标题、卡片或任务组件定向搜索，各类不重复追加配额；参考可为运营整页、模块或组件，按可用局部筛选，不强制完整页面；访问失败与案例不合适分开处理，不能泛搜只找到海报就请求跳过；不用同题材普通网站冒充活动整页范本；生图前实际展示参考链接、图片与借鉴点；活动规则默认只有浮动入口，平铺模块仅我主动要求时启用，标题与其他章节同母版，正文待后台配置并保持独立文本；缺少配置时每次只问一项并等待回答，沿用本次已提供内容。由你根据当前KV与相容参考自动设计背景，用轻量前景定位内容，示意即表达与丰富背景相称的轮廓、层次和视觉重量，不以选中后精做为由使用弱化默认框；常见1～6项奖品优先按约220～240px可见卡宽起排，结合实图、文字与两侧空间测量，不因示意或六奖品而额外缩小；同屏检查清晰度、纹理密度、气氛、主体衬托和交界，控制内容后方亮墙、雾光、反射的面积与对比，实际叠入前景确认卡片和操作突出，不因高清提高全局曝光；自动局部返修背景且保留合格前景，不一律压暗所有主题；无需我指导美术或先选测试模块，三套保持KV画风，但卡片、按钮、任务条等须有可见的设计形式区别，不把同一母版换色或边角微调算作不同方案，也不强求风格差距很大；展示前并排检查重复并修正，通过后用实际背景文件拼成A／B／C三套完整样张；样张按阶段减负：本轮共用一套排版骨架，各套保留不同视觉设计；每套优先以少量前景组合示意表达设计，不逐件抠图和精修导出。首版合成后集中检查，每套一轮合并修正，最多再一轮关键问题定点修复，不按问题重置次数。样张不运行完整交付校验，正式清单、全部状态、独立装饰及完整验收在选定后只做一套；保留三套最终背景、实际比例和单件设计质感。不要提前制作三套完整前景、状态或装饰。同一方案的所有套餐共用一张卡片底图和一张购买按钮底图，按套餐内容分别排HTML，不按数量重复生图；套餐底图默认连续主面，确需分色最多两块且辅助色面只在下方购买区；任务条先保证名称1行加说明2行的三行容量、行间距和舒展的上下净空，不截断或缩字，异形与厚边不得压薄中段信息面；底面连续到底，右侧只叠独立按钮，不生成额外包裹色块、槽框或底座。展示后等待我选定，复用所选背景，仅依据该套样张精细制作一套前景及所需状态、独立装饰；样张阶段按所选底板类型检查：对称包裹框验完整覆盖与同中心，平面图形衬托验构图、视觉中心及遮挡，实体承托验透视、深度与盒底落点；正式盒体继承所选关系，实际盲盒出来后按该类型复核，再做必要承托与光影局部修补，禁止整页背景重生。业务PNG、标题、装饰及母图默认统一72 PPI，用户明确指定其他PSD分辨率时按其值；保持像素和透明度，规范化后再冻结与记录hash。原KV独立保护，三套共用一次适配结果；意外改画保护区时原样合回，仅采用原图外延展。选中后明确仍需补足的前景结构、表面和边缘完成度，不能只放大示意件；检查所有素材的实际可见主体及内部承托，不强制自然物件或短标题贴满画布。真实回填、接缝与融合验收在制作档案完成，最后提供唯一平铺、用途命名、去重的正式素材文件夹和旁边的完整预览，代码、源文件和技术记录保留在制作档案。"
